name: peli_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - app
  - packages/memos_api

# 本地存储说明：
#
# 本地只有账号（实例地址 + 长效 PAT）与图片缓存密钥，全部存在平台安全存储里
# （Android 走 Keystore：RSA-OAEP 包裹密钥 + AES-GCM 加密内容），因此本工作区
# 不再包含任何数据库依赖 —— 之前的 SQLCipher 库已移除，启动链路因此不再加载原生库。
# 见 app/lib/data/local/account_store.dart 与 secret_store.dart。
#
