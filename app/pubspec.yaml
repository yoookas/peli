name: peli
description: Android client for memos (0.31.0 and later, including the 26.10 /api routes) — the official web frontend in a WebView, plus the native work a web page cannot do (session injection, attachment handling, encrypted credential store).
publish_to: none
version: 1.0.5+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # 登录：用户名密码 → 长效 PAT（本仓库内的纯 Dart 协议客户端）
  memos_api: ^0.1.0

  # 路径（文件选择、分享进来的临时文件）
  path_provider: ^2.1.5
  path: ^1.9.1

  # 账号与机密条目的唯一落盘位置（Android 上由 Keystore 保护）。
  #
  # 为什么不再用 SQLCipher：本地只有"实例地址 + 长效 PAT"这一行数据，而加载
  # libsqlcipher.so、打开库、读 DEK、解页的整段工作都在冷启动的关键路径上。
  # 换成一个 Keystore 条目后加密强度不变（根锁同样是 Keystore），启动不再碰原生库，
  # 也不再出现"库在、密钥丢 → 拒绝启动"的死局。见 lib/data/local/account_store.dart。
  #
  # 注意：flutter_secure_storage 11.x 依赖 win32 ^6.0.1，与 file_picker/image_picker
  # 的 win32 ^5.x 冲突；10.3.4 同样支持「RSA-OAEP 包裹 + AES-GCM 存储」且依赖可解。
  flutter_secure_storage: ^10.3.4

  # 状态与路由
  flutter_riverpod: ^3.4.3
  go_router: ^17.0.0

  # 主界面：内嵌官方 Web 前端
  # 选 webview_flutter 而不是 flutter_inappwebview：前者由 Flutter 官方维护、
  # 2026-07 仍在更新；后者最后发版是 2024-10，对 Android 15+ 的兼容存疑。
  webview_flutter: ^4.14.1
  # 直接用到 Android 侧的 setOnShowFileSelector（接管 <input type=file>）与权限回调，
  # 必须显式声明而不是依赖 webview_flutter 的传递依赖
  webview_flutter_android: ^4.14.1

  # 文件进入应用：网页文件选择与系统分享
  file_picker: ^10.3.3
  image_picker: ^1.2.0

  # 离线感知：Web 界面必须联网，断网时给出明确提示而不是白屏
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
